<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Free energy from a fuel enters a chemical system; part is stored or used, the rest is dissipated</title>
  <rect width="160" height="120" fill="#fff"/>
  <!-- input band -->
  <path d="M8 34 H58 V70 H8 Z" fill="#dfe9e5"/>
  <path d="M8 34 H58 M8 70 H58" stroke="#2f6a61" stroke-width="1.6"/>
  <path d="M22 44 L34 52 L22 60" fill="none" stroke="#2f6a61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- system -->
  <rect x="58" y="26" width="38" height="52" rx="7" fill="#fff" stroke="#161615" stroke-width="2.5"/>
  <circle cx="70" cy="42" r="3.2" fill="#161615"/><circle cx="84" cy="50" r="3.2" fill="#161615"/><circle cx="72" cy="62" r="3.2" fill="#161615"/>
  <path d="M73 43.5 L81 48.5 M82 53 L75 60 M71 58.8 L70 45.5" stroke="#161615" stroke-width="1.4"/>
  <!-- useful output: a narrow band -->
  <path d="M96 34 C116 34 122 24 140 24 H152 V36 H140 C126 36 118 46 96 46 Z" fill="#e0913f"/>
  <!-- dissipated: a wide band curving down -->
  <path d="M96 52 C122 52 124 70 124 84 V92 H100 V86 C100 76 99 70 96 70 Z" fill="#e4e4dd"/>
  <g fill="none" stroke="#9a9a94" stroke-width="1.8" stroke-linecap="round">
    <path d="M101 98 q3 4 0 8 q-3 4 0 8"/><path d="M112 98 q3 4 0 8 q-3 4 0 8"/><path d="M123 98 q3 4 0 8 q-3 4 0 8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
