<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Two coupled reaction cycles across a membrane, pumping cargo to one side</title>
  <rect width="160" height="120" fill="#fff"/>
  <!-- membrane -->
  <rect x="72" y="8" width="16" height="104" fill="#dfe9e5"/>
  <path d="M72 8 V112 M88 8 V112" stroke="#2f6a61" stroke-width="1.2"/>
  <!-- cargo: few on the left, many on the right -->
  <g fill="#e0913f">
    <circle cx="18" cy="24" r="3"/><circle cx="30" cy="102" r="3"/>
    <circle cx="112" cy="16" r="3"/><circle cx="128" cy="26" r="3"/><circle cx="146" cy="18" r="3"/>
    <circle cx="140" cy="100" r="3"/><circle cx="118" cy="106" r="3"/><circle cx="150" cy="60" r="3"/><circle cx="104" cy="98" r="3"/>
  </g>
  <!-- edges: two squares sharing the membrane edge -->
  <g stroke="#2f6a61" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M44 42 H71"/><path d="M80 47 V77"/><path d="M73 84 H44"/><path d="M38 77 V49"/>
    <path d="M89 42 H116"/><path d="M122 49 V77"/><path d="M116 84 H89"/>
  </g>
  <!-- arrowheads: the two cycles turn in opposite senses, so both drive the shared step the same way -->
  <g stroke="#2f6a61" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M60 37 L66 42 L60 47"/><path d="M75 71 L80 77 L85 71"/><path d="M50 79 L44 84 L50 89"/><path d="M33 55 L38 49 L43 55"/>
    <path d="M95 37 L89 42 L95 47"/><path d="M117 55 L122 49 L127 55"/><path d="M110 79 L116 84 L110 89"/>
  </g>
  <!-- states -->
  <g fill="#fff" stroke="#161615" stroke-width="2">
    <circle cx="38" cy="42" r="5.5"/><circle cx="80" cy="42" r="5.5"/><circle cx="122" cy="42" r="5.5"/>
    <circle cx="38" cy="84" r="5.5"/><circle cx="80" cy="84" r="5.5"/><circle cx="122" cy="84" r="5.5"/>
  </g>
  <circle cx="122" cy="42" r="2.4" fill="#e0913f"/><circle cx="38" cy="84" r="2.4" fill="#e0913f"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
