<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" xmlns:c2pa="http://c2pa.org/manifest">
  <title>A small ring threaded on a larger ring, moving between two binding sites, driven by a fuel-to-waste reaction</title>
  <rect width="160" height="120" fill="#fff"/>
  <!-- track -->
  <circle cx="80" cy="64" r="34" fill="none" stroke="#161615" stroke-width="2.5"/>
  <!-- binding sites -->
  <path d="M47.2 74.8 A34 34 0 0 1 46.6 55.5" fill="none" stroke="#2f6a61" stroke-width="7" stroke-linecap="round"/>
  <path d="M113.4 55.5 A34 34 0 0 1 112.8 74.8" fill="none" stroke="#2f6a61" stroke-width="7" stroke-linecap="round"/>
  <!-- small ring, threaded: behind the track on the left, in front on the right -->
  <ellipse cx="80" cy="30" rx="8" ry="13" fill="none" stroke="#e0913f" stroke-width="4"/>
  <path d="M68 31.2 A34 34 0 0 1 76.5 30.2" fill="none" stroke="#fff" stroke-width="7"/>
  <path d="M68 31.2 A34 34 0 0 1 76.5 30.2" fill="none" stroke="#161615" stroke-width="2.5"/>
  <path d="M86.5 22 A8 13 0 0 1 86.5 38" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M86.5 22 A8 13 0 0 1 86.5 38" fill="none" stroke="#e0913f" stroke-width="4" stroke-linecap="round"/>
  <!-- direction of rotation -->
  <path d="M112 22 A48 48 0 0 1 126 46" fill="none" stroke="#2f6a61" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M120.5 43.5 L126 46 L127.6 40" fill="none" stroke="#2f6a61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fuel in, waste out -->
  <circle cx="24" cy="100" r="4.5" fill="#e0913f"/>
  <path d="M31 100 H50" stroke="#8a4f12" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M46 96.5 L50 100 L46 103.5" fill="none" stroke="#8a4f12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="57" cy="100" r="4.5" fill="#fff" stroke="#8a4f12" stroke-width="1.8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
